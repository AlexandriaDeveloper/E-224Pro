<div cdkDrag cdkDragRootElement=".cdk-overlay-pane">

    <h2 mat-dialog-title class="form-dialog-title" cdkDragHandle>
        <button mat-icon-button (click)="onNoClick()" class="dialog-btn-close">
            <mat-icon>close</mat-icon>
        </button>
        <span class="title">البحث في الاستمارات</span>
    </h2>

    <mat-dialog-content class="form-dialog-content">
        <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
            <div style="display: flex; justify-content: center;gap: 10px;">
                <mat-form-field style="width: 30%;">
                    <mat-label>اسم الاستمارة</mat-label>
                    <input matInput placeholder="البحث باسم الاستمارة" formControlName="formName" />
                </mat-form-field>

                <mat-form-field style="width: 30%;">
                    <mat-label>رقم 224</mat-label>
                    <input matInput placeholder="البحث برقم 224" formControlName="num224" />
                </mat-form-field>

                <mat-form-field style="width: 30%;">
                    <mat-label>رقم 55</mat-label>
                    <input matInput placeholder="البحث برقم 55" formControlName="num55" />
                </mat-form-field>

            </div>
            <div style="display: flex; justify-content: center;gap: 10px; ">
                <mat-form-field style="width: 46%;">
                    <mat-label>الكلية</mat-label>

                    <mat-select formControlName="collageId" (selectionChange)="loadFunds($event.value)">
                        <mat-option [value]="0">الكل</mat-option>
                        @for (collage of collages; track collage.id) {
                        <mat-option [value]="collage.id">{{collage.collageName}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>


                <mat-form-field style="width: 46%;">
                    <mat-label>الصندوق</mat-label>

                    <mat-select formControlName="fundId">
                        <mat-option [value]="0">الكل</mat-option>
                        @for (fund of funds; track fund.id) {
                        <mat-option [value]="fund.id">{{fund.fundName}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>

            <div style="display: flex; justify-content: center;gap: 10px; ">
                <mat-form-field style="width: 46%;">
                    <mat-label>اسم المراجع</mat-label>
                    <input matInput placeholder="البحث باسم المراجع" formControlName="auditorName" />
                </mat-form-field>

                <mat-form-field style="width: 46%;">
                    <mat-label>حالة التوازن</mat-label>
                    <mat-select formControlName="isBalanced">
                        <mat-option [value]="''">الكل</mat-option>
                        <mat-option [value]="true">متوازن</mat-option>
                        <mat-option [value]="false">غير متوازن</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </form>
    </mat-dialog-content>

    <div style="display:flex !important;justify-content: center;">
        <button mat-mini-fab (click)="onSubmit()" style="width: 160px;" class="btn-secondary">
            بحث
            <mat-icon>search</mat-icon>
        </button>
        <div class="spacer"></div>
        <div style="width: 30px;"></div>
        <button mat-mini-fab (click)="clear()" style="width: 160px; " class="btn-warning">
            مسح
            <mat-icon>clear</mat-icon>
        </button>
    </div>
</div>
