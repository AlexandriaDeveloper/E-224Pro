<div cdkDrag cdkDragRootElement=".cdk-overlay-pane">
    <h2 mat-dialog-title class="form-dialog-title" cdkDragHandle>

        <span class="title">رفع ملف حساب فرعي</span>
        <button mat-icon-button (click)="onClose()" class="dialog-btn-close">
            <mat-icon>close</mat-icon>
        </button>
    </h2>

    <mat-dialog-content class="form-dialog-content">
        <form (ngSubmit)="upload()" class="upload-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>اختر ملف Excel</mat-label>
                <input matInput [value]="file?.name" placeholder="اختر ملف..." readonly>
                <button mat-icon-button matSuffix (click)="fileInput.click()" type="button">
                    <mat-icon>attach_file</mat-icon>
                </button>
                <input #fileInput type="file" accept=".xlsx,.xls" (change)="onFileChange($event)" hidden>
            </mat-form-field>


            <div *ngIf="file?.name" class="file-info">
                <mat-icon color="primary">check_circle</mat-icon>
                {{ file?.name }}
            </div>

            <mat-progress-bar *ngIf="uploading" mode="indeterminate"></mat-progress-bar>
            <div *ngIf="message && !uploading" class="upload-message">{{ message }}</div>

            <button mat-raised-button color="primary" type="submit"
                [disabled]="uploading || !file || !accountId || !dailyId">رفع الملف</button>
        </form>
    </mat-dialog-content>
</div>
