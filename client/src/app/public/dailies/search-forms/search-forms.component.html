<div class="table-container">

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 fixed-table" color="primary">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>
                <button mat-button [matMenuTriggerFor]="menu" style="color: #fff;">
                    <mat-icon>more_vert</mat-icon>
                </button>

                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="openSearchFileDialog()">
                        <mat-icon>search</mat-icon>
                        بحث

                    </button>

                </mat-menu>
            </th>
            <td mat-cell *matCellDef="let element">

                <button mat-icon-button (click)="openAddFormDialog(element)">
                    <mat-icon>edit</mat-icon>
                </button>

            </td>
        </ng-container>
        <ng-container matColumnDef="formName">
            <th mat-header-cell *matHeaderCellDef> الاستمارة </th>
            <td mat-cell *matCellDef="let element"> {{element.formName}} </td>
        </ng-container>
        <ng-container matColumnDef="num224">
            <th mat-header-cell *matHeaderCellDef> 224 </th>
            <td mat-cell *matCellDef="let element"> {{element.num224}} </td>
        </ng-container>
        <ng-container matColumnDef="num55">
            <th mat-header-cell *matHeaderCellDef> 55 </th>
            <td mat-cell *matCellDef="let element"> {{element.num55}} </td>
        </ng-container>
        <ng-container matColumnDef="collageName">
            <th mat-header-cell *matHeaderCellDef> الكلية </th>
            <td mat-cell *matCellDef="let element"> {{element.collageName}} </td>
        </ng-container>
        <ng-container matColumnDef="fundName">
            <th mat-header-cell *matHeaderCellDef> الصندوق </th>
            <td mat-cell *matCellDef="let element"> {{element.fundName}} </td>
        </ng-container>

        <ng-container matColumnDef="dailyType">
            <th mat-header-cell *matHeaderCellDef> اليومية </th>
            <td mat-cell *matCellDef="let element"> {{element.dailyType=="General"?"عاديه":"بيروول" }} </td>
        </ng-container>
        <!--        //i want it to be wider other cells-->
        <ng-container matColumnDef="dailyName">
            <th mat-header-cell *matHeaderCellDef> اليومية </th>
            <td mat-cell *matCellDef="let element">
                <button mat-stroked-button color="primary" mat-button
                    [routerLink]="['/public/dailies', element.dailyId]" target="_blank" rel="noopener noreferrer">
                    {{element.dailyName}}
                </button>
            </td>
        </ng-container>
        <ng-container matColumnDef="dailyDate">
            <th mat-header-cell *matHeaderCellDef> تاريخ اليومية </th>
            <td mat-cell *matCellDef="let element"> {{element.dailyDate}} </td>
        </ng-container>
        <ng-container matColumnDef="entryType">
            <th mat-header-cell *matHeaderCellDef> نوع القيد </th>
            <td mat-cell *matCellDef="let element"> {{element.entryType}} </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
            <td style="width: 100%;text-align: center; padding: 20px;" class="mat-cell" colspan="10">لا يوجد بيانات
                للعرض</td>
        </tr>
    </table>
    <mat-paginator [length]="paginator.length" [pageSize]="paginator.pageSize"
        [pageSizeOptions]="paginator.pageSizeOptions" showFirstLastButtons showFirstLastButtons aria-label="Select page"
        aria-label="Select page" (page)="handlePageEvent($event)" class="fixed-table">
    </mat-paginator>
</div>
