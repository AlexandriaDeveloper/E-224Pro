<ng-container *ngIf="auth.isLoggedIn()">

  <mat-toolbar class="sidebar-header" [class.compact-header]="isCompactView" [class.full-header]="!isCompactView">
    <mat-icon class="sidebar-icon">account_balance</mat-icon>
    <h2 class="sidebar-title" *ngIf="!isCompactView">نظام الحسابات</h2>
  </mat-toolbar>

  <mat-accordion class="example-headers-align" [ngClass]="layoutClass || ''">
    <mat-expansion-panel>
      <mat-expansion-panel-header>

        <mat-panel-title>

          اليوميات
        </mat-panel-title>

      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>

        <mat-nav-list>
          <a mat-list-item routerLink="dailies" class="nav-item">
            <mat-icon class="nav-icon">co_present</mat-icon>
            <span class="nav-label" [class.compact-text]="isCompactView"> إدارة اليوميات</span>
          </a>
          <a mat-list-item routerLink="forms/searchForms" class="nav-item">
            <mat-icon class="nav-icon">search</mat-icon>
            <span class="nav-label" [class.compact-text]="isCompactView">استعلام عن استمارة</span>
          </a>

          <!-- <a mat-list-item routerLink="/daily-entries"> الاستعلام عن يوميات </a>
        <a mat-list-item routerLink="/expense-forms">تسجيل استمارات الصرف</a>
        <a mat-list-item routerLink="/adjustments">تسجيل التسويات</a>
        <a mat-list-item routerLink="/general-ledger">دفتر الأستاذ العام</a>
        <a mat-list-item routerLink="/subsidiary-ledger">دفتر الأستاذ المساعد</a>
        <a mat-list-item routerLink="/trial-balance">ميزان المراجعة</a>
        <a mat-list-item routerLink="/financial-reports">التقارير المالية</a>
        <a mat-list-item (click)="logout()">تسجيل الخروج</a> -->
        </mat-nav-list>
      </ng-template>
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          الصناديق
        </mat-panel-title>

      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <mat-nav-list>
          <a mat-list-item routerLink="funds" class="nav-item">
            <mat-icon class="nav-icon">account_balance_wallet</mat-icon>
            <span class="nav-label" [class.compact-text]="isCompactView">ادارة الصناديق</span>
          </a>
        </mat-nav-list>

      </ng-template>
    </mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>

          الحسابات الفرعية

        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <mat-nav-list>

          <!--use for loop-->
          @for(subAccount of subAccounts; track subAccount.id) {
          <a mat-list-item routerLink="subsidary-dailies/subId/{{subAccount.id}}" class="nav-item">
            <mat-icon class="nav-icon">account_circle</mat-icon>
            <span class="nav-label" [class.compact-text]="isCompactView">{{subAccount.accountName}}</span>
          </a>

          }
        </mat-nav-list>
      </ng-template>
    </mat-expansion-panel>
  </mat-accordion>
</ng-container>
